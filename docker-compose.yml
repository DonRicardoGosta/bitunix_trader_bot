# =============================================================================
# Bitunix Trader - Docker Compose
# =============================================================================
# Három szolgáltatás: PostgreSQL, FastAPI backend, Next.js frontend.
# Three services: PostgreSQL, FastAPI backend, Next.js frontend.
#
# Erőforráskorlátok: minden szolgáltatás kapott CPU + memória plafont és
# soft reservation-t. A `deploy.resources.limits` szekciót a modern
# Docker Compose v2+ önállóan is alkalmazza (Swarm nélkül). A `mem_limit`
# / `cpus` mezők régebbi engine-kkel is működnek (legacy fallback).
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: bitunix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-bitunix_trader}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-bitunix_trader}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-1.0}"
          memory: ${DB_MEM_LIMIT:-512M}
        reservations:
          cpus: "0.25"
          memory: 128M
    cpus: ${DB_CPU_LIMIT:-1.0}
    mem_limit: ${DB_MEM_LIMIT:-512M}
    mem_reservation: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitunix-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://trader:change_me_in_production@db:5432/bitunix_trader}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      BITUNIX_API_KEY: ${BITUNIX_API_KEY:-}
      BITUNIX_API_SECRET: ${BITUNIX_API_SECRET:-}
      BITUNIX_REST_BASE_URL: ${BITUNIX_REST_BASE_URL:-https://fapi.bitunix.com}
      BITUNIX_WS_PUBLIC_URL: ${BITUNIX_WS_PUBLIC_URL:-wss://fapi.bitunix.com/public/}
      BITUNIX_WS_PRIVATE_URL: ${BITUNIX_WS_PRIVATE_URL:-wss://fapi.bitunix.com/private/}
      BITUNIX_MARGIN_COIN: ${BITUNIX_MARGIN_COIN:-USDT}
      STRATEGY_RUNNER_ENABLED: ${STRATEGY_RUNNER_ENABLED:-true}
      STRATEGY_INTERVAL_SECONDS: ${STRATEGY_INTERVAL_SECONDS:-30}
      CALIBRATION_ENABLED: ${CALIBRATION_ENABLED:-true}
      CALIBRATION_INTERVAL_SECONDS: ${CALIBRATION_INTERVAL_SECONDS:-3600}
      CALIBRATION_LOOKBACK_MINUTES: ${CALIBRATION_LOOKBACK_MINUTES:-120}
      CALIBRATION_TOP_N: ${CALIBRATION_TOP_N:-20}
      CALIBRATION_KLINE_INTERVAL: ${CALIBRATION_KLINE_INTERVAL:-1m}
      CALIBRATION_TP_ATR_MULT: ${CALIBRATION_TP_ATR_MULT:-3.0}
      CALIBRATION_SL_ATR_MULT: ${CALIBRATION_SL_ATR_MULT:-1.5}
      CALIBRATION_MAX_AGE_MINUTES: ${CALIBRATION_MAX_AGE_MINUTES:-180}
      REQUIRE_CALIBRATION_FOR_TRADING: ${REQUIRE_CALIBRATION_FOR_TRADING:-true}
      POSITION_TPSL_RESOLVE_MAX_ATTEMPTS: ${POSITION_TPSL_RESOLVE_MAX_ATTEMPTS:-40}
      POSITION_TPSL_RESOLVE_DELAY_SECONDS: ${POSITION_TPSL_RESOLVE_DELAY_SECONDS:-0.5}
      ORDERS_ENRICHMENT_CACHE_TTL_SECONDS: ${ORDERS_ENRICHMENT_CACHE_TTL_SECONDS:-60}
      LIVE_UI_PUSH_ENABLED: ${LIVE_UI_PUSH_ENABLED:-true}
      LIVE_UI_PUSH_INTERVAL_SECONDS: ${LIVE_UI_PUSH_INTERVAL_SECONDS:-2}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-1.0}"
          memory: ${BACKEND_MEM_LIMIT:-512M}
        reservations:
          cpus: "0.25"
          memory: 128M
    cpus: ${BACKEND_CPU_LIMIT:-1.0}
    mem_limit: ${BACKEND_MEM_LIMIT:-512M}
    mem_reservation: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bitunix-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${APP_ENV:-development}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Bitunix Trader}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-1.0}"
          memory: ${FRONTEND_MEM_LIMIT:-1G}
        reservations:
          cpus: "0.25"
          memory: 256M
    cpus: ${FRONTEND_CPU_LIMIT:-1.0}
    mem_limit: ${FRONTEND_MEM_LIMIT:-1G}
    mem_reservation: 256M

volumes:
  postgres-data:
    driver: local
